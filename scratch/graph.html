erary?PatternNo=246485"}, {"text": "1.因疫情後東京迪士尼度假區有嚴格的入園人數管控，且團體票券須經事前網路上預約（現場沒有販售實體票券），最晚請於團體出發前１４個工作日確認是否前往東京迪士尼度假區， 可選擇A(東京迪士尼樂園) 或 B(東京迪士尼海洋)入園。", "kind": "旅行社注意事項", "url": "https://travel.liontravel.com/detail?NormGroupID=1115a5ac-863d-449d-ae01-44252307e034"}, {"text": "若未於出團前１４個工作天提出需求，則會統一購買入園人數多的園區為主，以免門票因人數管控而無法入園。", "kind": "旅行社注意事項", "url": "https://travel.liontravel.com/detail?NormGroupID=1115a5ac-863d-449d-ae01-44252307e034"}, {"text": "ＰＳ．且若因14天前若遇當日無法預期入園人數超過限制額而無法入園之情況，則會優先購買當日可入園之東京迪士尼度假區其一之門票，敬請瞭解。", "kind": "旅行社注意事項", "url": "https://travel.liontravel.com/detail?NormGroupID=1115a5ac-863d-449d-ae01-44252307e034"}, {"text": "且園區採入園人員總數管制限制，無法臨時變更選擇不同的園區，只能當天重新排隊購買，可能會發生無法入園的情形， 且原票券退票須扣除500台幣退票手續費，敬請知悉 。", "kind": "旅行社注意事項", "url": "https://travel.liontravel.com/detail?NormGroupID=1115a5ac-863d-449d-ae01-44252307e034"}, {"text": "例如：臨時由「前往東京迪士尼樂園」變更為「前往東京迪士尼海洋」之情形，如臨時更改以致產生相關費用(例如：換退票手續費500台幣或門票價差等)需請另自行支付，不便之處敬請見諒。", "kind": "旅行社注意事項", "url": "https://travel.liontravel.com/detail?NormGroupID=1115a5ac-863d-449d-ae01-44252307e034"}, {"text": "且因入園當日領隊將與選擇後佔多數之貴賓一同入園，所以佔少數之貴賓需自行前往該樂園排隊且自費購買FIT個人票券入園，不便之處敬請見諒。", "kind": "旅行社注意事項", "url": "https://travel.liontravel.com/detail?NormGroupID=1115a5ac-863d-449d-ae01-44252307e034"}, {"text": "4. 東京迪士尼樂園及東京迪士尼海洋偶有特殊包場活動關係，營業時間至下午或傍晚止的情形(12月31日當日因團體票券之限制，營業時間皆至PM 6:00 止) 且樂園內的各項設施及表演節目、遊行或活動等，依天候、季節性及日期會有暫停、休止、保養等情形，詳細依官網公告為主。", "kind": "旅行社注意事項", "url": "https://travel.liontravel.com/detail?NormGroupID=1115a5ac-863d-449d-ae01-44252307e034"}, {"text": "且入園日期可能因飯店住宿順序而調整，無法接受指定。", "kind": "旅行社注意事項", "url": "https://travel.liontravel.com/detail?NormGroupID=1115a5ac-863d-449d-ae01-44252307e034"}, {"text": "(若遇天候不良，遊行與煙火表演取消，敬請見諒)", "kind": "旅行社注意事項", "url": "https://www.travel4u.com.tw/group/itinerary/TYO06RMQ3/"}, {"text": "因東京迪士尼樂園疫後有嚴格管控每日入園人數上限，為避免您喜愛的東京迪士尼樂園或海洋門票完售，煩請於報名付訂金時，一併與業務告知您要參加哪一個迪士尼樂園！", "kind": "旅行社注意事項", "url": "https://www.travel4u.com.tw/group/itinerary/TYO06RMQ3/"}, {"text": "且迪士尼樂園入園日期可能因飯店住宿順序而調整，無法接受指定，目前東京迪士尼樂園採用電子票券入園，建議前往園區的客人都需準備一支於國外可連上網路的手機以供入園使用，並建議可事先下載迪士尼官方APP。", "kind": "旅行社注意事項", "url": "https://www.travel4u.com.tw/group/itinerary/TYO06RMQ3/"}], "observations": [{"trip_id": "colatour_246485", "months": [10, 12], "name_raw": "東京迪士尼樂園 或 東京迪士尼海洋 (園區二擇一/搭乘飯店接駁巴士來回)", "visit_type": "入內參觀", "stay_min": null, "as_area": false}, {"trip_id": "liontravel_1115a5ac-863d-449d-ae01-44252307e034", "months": [10], "name_raw": "全日 東京迪士尼樂園 或 東京迪士尼海洋(盡情暢遊一票到底) ～ 本日搭乘 [電車] 或 [飯店接駁車] 往返", "visit_type": null, "stay_min": null, "as_area": false}, {"trip_id": "liontravel_86545bd1-ff78-4498-9669-8111d8b78c0e", "months": [10], "name_raw": "全日 東京迪士尼樂園 或 東京迪士尼海洋 ( 二擇一，盡情暢遊一票到底) ～ 本日搭乘 [電車] 或 [飯店接駁車] 往返", "visit_type": null, "stay_min": null, "as_area": false}, {"trip_id": "travel4u_TYO06RMQ3", "months": [1, 2, 3, 10, 11, 12], "name_raw": "搭乘 [電車] 或 [飯店接駁車] ～ 全日 東京迪士尼樂園 或 迪士尼海洋：與米奇、米妮、唐老鴨、維尼熊一同遨遊探險樂園～明日世界、夢幻世界、動物天地、灰姑娘的城堡、叢林巡航、巨雷山、鬼屋、小小世界、太空山、巴斯光年的星際歷險", "visit_type": null, "stay_min": null, "as_area": false}]}}, {"id": "P013", "label": "河口湖遊覽船天晴號", "color": "#4e79a7", "has_ev": true, "count": 1, "title": "河口湖遊覽船天晴號｜富士五湖｜遊船纜車｜1 個來源", "raw": {"poi_id": "P013", "poi_name": "河口湖遊覽船天晴號", "category": "遊船纜車", "area": "富士五湖", "aliases": [], "lat": null, "lon": null, "duration": null, "duration_samples": [], "hours": [], "months": [11, 12], "source_count": 1, "url": ["https://tour.colatour.com.tw/itinerary?PatternNo=246661"], "evidence": [{"text": "如遇遊覽船預約額滿、船隻不定期檢修停駛，天災等不可抗力之因素、則以其他遊覽船替代或每人退費日幣1000元，敬請理解。", "kind": "旅行社注意事項", "url": "https://tour.colatour.com.tw/itinerary?PatternNo=246661"}, {"text": "船家目前已知定休日以及不接受預約的日期如下： 6/9、6/16、6/23、6/30、8/5、8/8~17、9/19～9/23、12/1、12/8、12/10~12/13、12/15、12/22、2027年 1/19、1/26。", "kind": "旅行社注意事項", "url": "https://tour.colatour.com.tw/itinerary?PatternNo=246661"}], "observations": [{"trip_id": "colatour_246661", "months": [11, 12], "name_raw": "河口湖遊覽船~天晴號", "visit_type": "入內參觀", "stay_min": null, "as_area": false}]}}, {"id": "P014", "label": "富士北口淺間神社", "color": "#4e79a7", "has_ev": false, "count": 1, "title": "富士北口淺間神社｜富士五湖｜神社寺廟｜1 個來源", "raw": {"poi_id": "P014", "poi_name": "富士北口淺間神社", "category": "神社寺廟", "area": "富士五湖", "aliases": [], "lat": null, "lon": null, "duration": null, "duration_samples": [], "hours": [], "months": [11, 12], "source_count": 1, "url": ["https://tour.colatour.com.tw/itinerary?PatternNo=246661"], "evidence": [], "observations": [{"trip_id": "colatour_246661", "months": [11, 12], "name_raw": "富士北口淺間神社", "visit_type": "入內參觀", "stay_min": null, "as_area": false}]}}, {"id": "P015", "label": "上野阿美橫町", "color": "#e15759", "has_ev": true, "count": 2, "title": "上野阿美橫町｜東京｜商圈老街｜2 個來源", "raw": {"poi_id": "P015", "poi_name": "上野阿美橫町", "category": "商圈老街", "area": "東京", "aliases": [], "lat": 35.7100592, "lon": 139.7745428, "duration": 90, "duration_samples": [90], "hours": [], "months": [11, 12], "source_count": 2, "url": ["https://tour.colatour.com.tw/itinerary?PatternNo=246661", "https://www.funliday.com/prevengers/journals/57214"], "evidence": [{"text": "配合日本巴士用車時間規定，此景點可能視當日狀況改以電車前往，敬請理解。", "kind": "旅行社注意事項", "url": "https://tour.colatour.com.tw/itinerary?PatternNo=246661"}, {"text": "在飯店寄放完行李後，散步至阿美橫丁商店街逛逛。\n\n「阿美橫丁」指的就是連接JR上野站和御徒町站的天橋下方的一整條商店街，全長約400公尺，最初是以黑市興起的商店街，販售各種形形色色的商品，光是賣糖果的店就有兩百多間，因為禁止車輛通行，所以可以放心在裡面逛。\n\n除了最多的糖果店以外，阿美橫丁同時也是藥妝的一級戰區，從進入阿美橫丁開始，沿路有OS drug（オーエスドラッグ）、松本清一店（薬 マツモトキヨシ）、Sundrug（サンドラッグ）、松本清二店、大國等藥妝店。雖然據說這邊的東西非常便宜，但在旅遊時時間就是金錢，也不太好一一比價，選個一兩家自己喜歡的逛就好（私心推薦大國藥妝）。\n\n必嚐小吃：阿美橫燒、肉的大山、大章魚燒みなとや以及百果園。", "kind": "遊記", "url": "https://www.funliday.com/prevengers/journals/57214"}], "observations": [{"trip_id": "colatour_246661", "months": [11, 12], "name_raw": "上野阿美橫町散策", "visit_type": "入內參觀", "stay_min": null, "as_area": false}, {"trip_id": "funliday_57214", "months": [], "name_raw": "上野阿美橫町", "visit_type": null, "stay_min": 90, "as_area": false}]}}, {"id": "P016", "label": "明治神宮", "color": "#e15759", "has_ev": false, "count": 3, "title": "明治神宮｜東京｜神社寺廟｜3 個來源", "raw": {"poi_id": "P .7111163, "lon": 139.7963656, "duration": 120, "duration_samples": [120, 30, 120], "hours": [], "months": [1, 3, 4, 10, 11, 12], "source_count": 6, "url": ["https://tour.colatour.com.tw/itinerary?PatternNo=246661", "https://www.funliday.com/prevengers/journals/123945", "https://www.funliday.com/prevengers/journals/57214", "https://www.funliday.com/fukuoka_yumeko/journals/72307", "https://travel.liontravel.com/detail?NormGroupID=4d01cab3-cb93-42d4-9b9a-2302d4db0776", "https://www.travel4u.com.tw/group/itinerary/TYO05KHH012/"], "evidence": [{"text": "淺草寺是東京都內最古老的寺廟之一，在江戶時代被德川家康指定為幕府的祈願所，也是日本庶民文化的中心。進入淺草寺前，先在大香爐（こうろ）把煙攬到自己身上，祈求身體健康，並到手水舍用勺子取水洗手並漱口，再入內參拜。\n\n值得一提的是，淺草寺並非神社，而為佛教寺院，參拜時不需擊掌，僅需擲錢、雙手合十祈禱，離去山門時再對本堂鞠躬。參拜完後，可以在求籤處，投入100円求個籤，從籤筒裡倒出一支籤，再從籤上的號碼去拿籤語。若是不幸抽到下籤也不避太緊張，可以將籤綁在寺廟指定的架子上，寺裡的和尚會幫忙念經消災。", "kind": "遊記", "url": "https://www.funliday.com/prevengers/journals/57214"}, {"text": "淺草寺 \n過年🧨第一天來到東京當然要到淺草寺參拜，第一次到淺草寺跨年，想著晚上一定很多人，所以趁著早上6:00的時候參拜。剛好錯過了人潮。一早的淺草寺人還滿多的，但沒有擠到水泄不通。\n\n浅草寺 雷門\n📍東京都台東区浅草２丁目３−１\n🌍 senso-ji.jp", "kind": "遊記", "url": "https://www.funliday.com/fukuoka_yumeko/journals/72307"}], "observations": [{"trip_id": "colatour_246661", "months": [11, 12], "name_raw": "淺草觀音寺(風雷神門)、仲見世街", "visit_type": "入內參觀", "stay_min": null, "as_area": false}, {"trip_id": "funliday_123945", "months": [], "name_raw": "淺草 雷門", "visit_type": null, "stay_min": 120, "as_area": false}, {"trip_id": "funliday_57214", "months": [], "name_raw": "淺草寺", "visit_type": null, "stay_min": 30, "as_area": false}, {"trip_id": "funliday_72307", "months": [1], "name_raw": "浅草寺", "visit_type": null, "stay_min": 120, "as_area": false}, {"trip_id": "liontravel_4d01cab3-cb93-42d4-9b9a-2302d4db0776", "months": [10], "name_raw": "淺草觀音寺", "visit_type": null, "stay_min": null, "as_area": false}, {"trip_id": "travel4u_TYO05KHH012", "months": [3, 4], "name_raw": "淺草觀音寺", "visit_type": null, "stay_min": null, "as_area": false}]}}, {"id": "P019", "label": "仲見世街", "color": "#e15759", "has_ev": true, "count": 2, "title": "仲見世街｜東京｜商圈老街｜2 個來源", "raw": {"poi_id": "P019", "poi_name": "仲見世街", "category": "商圈老街", "area": "東京", "aliases": ["Nakamise Street"], "lat": 35.7124343, "lon": 139.7965255, "duration": 90, "duration_samples": [90], "hours": [], "months": [11, 12], "source_count": 2, "url": ["https://tour.colatour.com.tw/itinerary?PatternNo=246661", "https://www.funliday.com/prevengers/journals/57214"], "evidence": [{"text": "從上野廣小路站搭乘銀座線4站到淺草站下車，走出地鐵站後沒幾步便會看到雷門，有許多遊客會在前面與雷門合照留作紀念。從雷門底下走進去就是日本歷史最悠久的仲見世通，全長250公尺，共有一百多間店舖，商品以傳統紀念品和傳統小吃為主，近期更是推出許多在SNS上熱門的特色小吃。", "kind": "遊記", "url": "https://www.funliday.com/prevengers/journals/57214"}], "observations": [{"trip_id": "colatour_246661", "months": [11, 12], "name_raw": "淺草觀音寺(風雷神門)、仲見世街", "visit_type": "入內參觀", "stay_min": null, "as_area": false}, {"trip_id": "funliday_57214", "months": [], "name_raw": "Nakamise Street", "visit_type": null, "stay_min": 90, "as_area": false}]}}, {"id": "P020", "label": "東京晴空塔", "color": "#e15759", "has_ev": true, "count": 3, "title": "東京晴空塔｜東京｜地標展望｜3 個來源", "raw": {"poi_id": "P020", "poi_name": "東京晴空塔", "category": "地標展望", "area": "東京", "aliases": ["晴空塔", "SKYTREE"], "lat": 35.7100454, "lon": 139.810714, "duration": 90, "duration_samples": [90], "hours": [], "months": [1, 2, 3, 10, 11, 12], "source_count": 3, "url": ["https://tour.colatour.com.tw/itinerary?PatternNo=246661", "https://www.funliday.com/prevengers/journals/57214", "https://www.travel4u.com.tw/group/itinerary/TYO06RMQ3/"], "evidence": [{"text": "逛完底下的晴空街道，可以至景觀台觀賞東京的市景，無論是日景或是夜景都相當壯觀，各有特色。\n展望台分為兩層，第一展望台「天望Deck」高350公尺，有展望咖啡以及景觀餐廳，可以透過大型玻璃360度地一覽關東絕景，天氣好的時候，在塔上還能看見富士山。\n如果想到更高的地方看夜景，可以到第二展望台，第二展望台「天望回廊」高450公尺，有繞塔一周的360度空中迴廊，能在天空下感受零距離的魅力景致。", "kind": "遊記", "url": "https://www.funliday.com/prevengers/journals/57214"}], "observations": [{"trip_id": "colatour_246661", "months": [11, 12], "name_raw": "東京晴空塔(車內遠眺)", "visit_type": "入內參觀", "stay_min": null, "as_area": false}, {"trip_id": "funliday_57214", "months": [], "name_raw": "東京晴空塔", "visit_type": null, "stay_min": 90, "as_area": false}, {"trip_id": "travel4u_TYO06RMQ3", "months": [1, 2, 3, 10, 11, 12], "name_raw": "東京晴空塔SKYTREE~特別安排★350M展望台天望甲板入內參觀", "visit_type": null, "stay_min": null, "as_area": false}]}}, {"id": "P021", "label": "天空町商店街", "color": "#e15759", "has_ev": true, "count": 3, "title": "天空町商店街｜東京｜購物｜3 個來源", "raw": {"poi_id": "P021", "poi_name": "天空町商店街", "category": "購物", "area": "東京", "aliases": ["東京晴空街道", "晴空街道商店街"], "lat": 35.7101864, "lon": 139.8110146, "duration": 60, "duration_samples": [60], "hours": [], "months": [10, 11, 12], "source_count": 3, "url": ["https://tour.colatour.com.tw/itinerary?PatternNo=246661", "https://www.funliday.com/prevengers/journals/57214", "https://travel.liontravel.com/detail?NormGroupID=4d01cab3-cb93-42d4-9b9a-2302d4db0776"], "evidence": [{"text": "天空町商店街位在晴空塔內，晴空塔停車場採預約制，若無預約到，則改用電車往返替代，敬請理解。", "kind": "旅行社注意事項", "url": "https://tour.colatour.com.tw/itinerary?PatternNo=246661"}, {"text": "「東京晴空街道（TOKYO Solamachi）」為晴空塔下1~31樓的購物中心，以晴空塔為中心，商場超過300間店舖，分為西館（West Yard）、中間塔樓館（Tower Yard）、東館（East Yard），除了有販售具日本式設計、時尚、傳統工藝工藝品等等的商店，也有象徵大眾流行文化的商品，想要什麼在這裡都可以滿足，應有盡有。商場的動向規劃十分好，環境也很乾淨，在這邊值得買一些有紀念價值的伴手禮留作紀念。", "kind": "遊記", "url": "https://www.funliday.com/prevengers/journals/57214"}], "observations": [{"trip_id": "colatour_246661", "months": [11, 12], "name_raw": "天空町商店街", "visit_type": "入內參觀", "stay_min": null, "as_area": false}, {"trip_id": "funliday_57214", "months": [], "name_raw": "東京晴空街道", "visit_type": null, "stay_min": 60, "as_area": false}, {"trip_id": "liontravel_4d01cab3-cb93-42d4-9b9a-2302d4db0776", "months": [10], "name_raw": "晴空街道商店街", "visit_type": null, "stay_min": null, "as_area": false}]}}, {"id": "P022", "label": "原宿竹下通", "color": "#e15759", "has_ev": false, "count": 1, "title": "原宿竹下通｜東京｜商圈老街｜1 個來源", "raw": {"poi_id": "P022", "poi_name": "原宿竹下通", "category": "商圈老街", "area": "東京", "aliases": [], "lat": 35.6715486, "lon": 139.7032228, "duration": 150, "duration_samples": [150], "hours": [], "mon 945"], "evidence": [], "observations": [{"trip_id": "funliday_123945", "months": [], "name_raw": "鎌倉高校前站", "visit_type": null, "stay_min": 60, "as_area": false}]}}, {"id": "P026", "label": "築地市場", "color": "#e15759", "has_ev": true, "count": 2, "title": "築地市場｜東京｜市場｜2 個來源", "raw": {"poi_id": "P026", "poi_name": "築地市場", "category": "市場", "area": "東京", "aliases": ["Tsukiji Fish Market"], "lat": 35.6654904324336, "lon": 139.770665131509, "duration": 120, "duration_samples": [120, 120, 180], "hours": ["⏰6:00~15:00"], "months": [1], "source_count": 2, "url": ["https://www.funliday.com/prevengers/journals/123945", "https://www.funliday.com/fukuoka_yumeko/journals/72307"], "evidence": [{"text": "趕行程快閃築地😝", "kind": "遊記", "url": "https://www.funliday.com/prevengers/journals/123945"}, {"text": "築地快閃", "kind": "遊記", "url": "https://www.funliday.com/prevengers/journals/123945"}, {"text": "接下來我們搭乘地鐵到築地市場\n跟著地鐵🚇的指示走\n地鐵站出來後 大約走五～八分鐘 就可以到達築地市場\n過年的築地市場感覺蠻多人的 可能日本人也來買年貨 感覺有點像是台灣迪化街感覺\n築地市場有分為外市場和內市場 \n外市場主要賣 給觀光客的美食\n\n內市場主要賣新鮮的魚貨，海鮮\n\n松露玉子燒 \n大家看到這個松露玉子燒 不要以為它有包松露唷～松露玉子燒 只是他的名字名字\n沒有包松露在裡面的\n築地市場這邊玉子燒滿多是冷藏的 所以我剛好看到松露這家玉子燒店 還是用熱熱的 就馬上來買了 價錢的話是8個入 ¥300日圓 感覺還可以 \n一顆一顆大小就大概是嘴巴可以塞入的感覺\n\n吃起來蠻多汁 像吃吸很飽滿湯汁的凍豆腐～\n我覺得還不錯 是下次來還可以吃的美食\n\n松露玉子燒\n📍東京都中央区築地４丁目１３−１３\n⏰6:00~15:00\n🌍 shouro.co.jp\n\n再來我們來築地市場外圍吃海鮮🦞\n大家來築地市場一定知道他們海鮮非常有名\n所以這次選擇在築地市場外圍的這家店\n價錢也比較合理。原本逛著逛著 發覺築地市場的海鮮都特別的貴，一碗可以到¥8000～¥10000 我們這次選擇的是¥1500的套餐 排隊時間為30分鐘。如果跟其他家比的話排隊時間已經少很多了。\n我點的是三色丼飯 有包含鮭魚軟 鮭魚 海膽。\n整體吃下來 覺得普普通通。不會說之後會特別想來吃這一家\n如果大家在築地市場有推薦的海鮮的話 歡迎在下方留言告訴我唷～～", "kind": "遊記", "url": "https://www.funliday.com/fukuoka_yumeko/journals/72307"}], "observations": [{"trip_id": "funliday_123945", "months": [], "name_raw": "Tsukiji Fish Market", "visit_type": null, "stay_min": 120, "as_area": false}, {"trip_id": "funliday_123945", "months": [], "name_raw": "Tsukiji Fish Market", "visit_type": null, "stay_min": 120, "as_area": false}, {"trip_id": "funliday_72307", "months": [1], "name_raw": "築地市場", "visit_type": null, "stay_min": 180, "category": "地標展望", "area": "東京", "aliases": ["SHIBUYA SKY"], "lat": 35.6582094, "lon": 139.7022782, "duration": 60, "duration_samples": [60], "hours": [], "months": [3, 4], "source_count": 2, "url": ["https://www.funliday.com/prevengers/journals/123945", "https://www.travel4u.com.tw/group/itinerary/TYO05KHH012/"], "evidence": [{"text": "因每段進場時間有一定人數限制，團體有可能無法全部於同一時間進場，進場時間可能會有前後 20 - 30 分鐘左右的差距，如無法購買到整團鄰近時間，則改前往東京晴空塔天望甲板（350M）或東京鐵塔(150M)，造成不便，敬請見諒。", "kind": "旅行社注意事項", "url": "https://www.travel4u.com.tw/group/itinerary/TYO05KHH012/"}, {"text": "SHIBUYA SKY 一經購買後即無法變更或取消，為確保入場資格，團體將會提早購票，如放棄此景點的旅客不另外退費，敬請見諒。", "kind": "旅行社注意事項", "url": "https://www.travel4u.com.tw/group/itinerary/TYO05KHH012/"}, {"text": "依預約狀況而定，團體可能會先回飯店放行李後再前往 SHIBUYA SKY，回程再由導遊帶領搭乘電車返回飯店。", "kind": "旅行社注意事項", "url": "https://www.travel4u.com.tw/group/itinerary/TYO05KHH012/"}, {"text": "入場後依規定隨身物品須置放於置物櫃中，押金 100 日幣，待物品取回後退還。", "kind": "旅行社注意事項", "url": "https://www.travel4u.com.tw/group/itinerary/TYO05KHH012/"}, {"text": "請務必注意 SHIBUYA SKY 無法指定入場時間，以實際訂到時間為主。", "kind": "旅行社注意事項", "url": "https://www.travel4u.com.tw/group/itinerary/TYO05KHH012/"}], "observations": [{"trip_id": "funliday_123945", "months": [], "name_raw": "澀谷 SKY", "visit_type": null, "stay_min": 60, "as_area": false}, {"trip_id": "travel4u_TYO05KHH012", "months": [3, 4], "name_raw": "澀谷展望台SHIBUYA SKY", "visit_type": null, "stay_min": null, "as_area": false}]}}, {"id": "P037", "label": "澀谷109", "color": "#e15759", "has_ev": false, "count": 1, "title": "澀谷109｜東京｜購物｜1 個來源", "raw": {"poi_id": "P037", "poi_name": "澀谷109", "category": "購物", "area": "東京", "aliases": [], "lat": 35.6595934, "lon": 139.6987266, "duration": 60, "duration_samples": [60], "hours": [], "months": [], "source_count": 1, "url": ["https://www.funliday.com/prevengers/journals/123945"], "evidence": [], "observations": [{"trip_id": "funliday_123945", "months": [], "name_raw": "澀谷109", "visit_type": null, "stay_min": 60, "as_area": false}]}}, {"id": "P038", "label": "澀谷PARCO", "color": "#e15759", "has_ev": false, "count": 1, "title": "澀谷PARCO｜東京｜購物｜1 個來源", "raw": {"poi_id": "P038", "poi_name": "澀谷PARCO", "category": "購物", "area": "東京", "aliases": [], "lat": 35.661951, "lon": 139.6986721, "duration": 60, "duration_samples": [60], "hours": [], "months": [], "source_count": 1, "url": ["https://www.funliday.com/prevengers/journals/123945"], "evidence": [], "observations": [{"trip_id": "funliday_123945", "months": [], "name_raw": "澀谷PARCO", "visit_type": null, "stay_min": 60, "as_area": false}]}}, {"id": "P039", "label": "日本橋三越本店", "color": "#e15759", "has_ev": true, "count": 1, "title": "日本橋三越本店｜東京｜購物｜1 個來源", "raw": {"poi_id": "P039", "poi_name": "日本橋三越本店", "category": "購物", "area": "東京", "aliases": [], "lat": 35.6854433, "lon": 139.773598, "duration": 60, "duration_samples": [60], "hours": [], "months": [], "source_count": 1, "url": ["https://www.funliday.com/yokubaritabiko/journals/48388"], "evidence": [{"text": "日本橋周辺を散策。\n三越のデパ地下やあちこちにあるコレド室町のショップをチェック。", "kind": "遊記", "url": "https://www.funliday.com/yokubaritabiko/journals/48388"}], "observations": [{"trip_id": "funliday_48388", "months": [], "name_raw": "日本橋三越本店", "visit_type": null, "stay_min": 60, "as_area": false}]}}, {"id": "P040", "label": "誠品生活日本橋", "color": "#e15759", "has_ev": true, "count": 1, "title": "誠品生活日本橋｜東京｜購物｜1 個來源", "raw": {"poi_id": "P040", "poi_name": "誠品生活日本橋", "category": "購物", "area": "東京", "aliases": [], "lat": 35.6880972, "lon": 139.7727777, "duration": 120, "duration_samples": [120], "hours": [], "months": [], "source_count": 1, "url": ["https://www.funliday.com/yokubaritabiko/journals/48388"], "evidence": [{"text": "COREDO室町テラス 2階の誠品生活へ。\n台湾の誠品生活と同じ雰囲気で、どこかデザイン性のある店内は大人の雰囲気。\n書籍、文具、台湾雑貨に台湾からやってきた専門店、ティーサロンにレストランと台湾好きにとってはここだけでかなりの時間を過ごせる空間。\n台湾関連の書籍の充実度は日本一。時折イベントや、近頃はオンラインイベントも頻繁にやっているので、チェックしておくとなにかと面白いカルチャーに出会えるはず。", "kind": "遊記", "url": "https://www.funliday.com/yokubaritabiko/journals/48388"}], "observations": [{"trip_id": "funliday_48388", "months": [], "name_raw": "誠品生活日本橋", "visit_type": null, "stay_min": 120, "as_area": false}]}}, {"id": "P041", "label": "淺草文化觀光中心", "color": "#e15759", "has_ev": true, "count": 1, "title": "淺草文化觀光中心｜東京｜地標展望｜1 個來源", "raw": {"poi_id": "P041", "poi_name": "淺草文化觀光中心", "category": "地標展望", "area": "東京", "aliases": [], "lat": 35.7106746, "lon": 139.796471, "duration": 20, "duration_samples": [20], "hours": [], "months": [], "source_count": 1, "url": ["https://www.funliday.com/prevengers/journals/57214"], "evidence": [{"text": "淺草文化觀光中心是位於雷門對面的遊客中心，提供旅遊資訊及其他服務。建築物是由日本知名建築師畏研吾所設計。最頂樓的咖啡廳和展望台可以將淺草街道和仲見世通盡收眼底，景色非常的好，在底下的人和房子都變成像模型一樣迷你可愛，是攝影的熱門景點。", "kind": "遊記", "url": "https://www.funliday.com/prevengers/journals/57214"}], "observations": [{"trip_id": "funliday_57214", "months": [], "name_raw": "淺草文化觀光中心", "visit_type": null, "stay_min": 20, "as_area": false}]}}, {"id": "P042", "label": "東京水岸街道", "color": "#e15759", "has_ev": true, "count": 1, "title": "東京水岸街道｜東京｜商圈老街｜1 個來源", "raw": {"poi_id": "P042", "poi_name": "東京水岸街道", "category": "商圈老街", "area": "東京", "aliases": ["Tokyo Mizumachi"], "lat": 35.7112147, "lon": 139.80287, "duration": 60, "duration_samples": [60], "hours": [], "months": [], "source_count": 1, "url": ["https://www.funliday.com/prevengers/journals/57214"], "evidence": [{"text": "以前逛完淺草想再接著去晴空塔的話，必須要搭乘電車才能前往。但在2020年後，多了一條超方便的隅田川步道「Sumida River Walk（すみだリバーウォーク）」，步道長約160公尺，一邊聽著電車哐璫哐璫的聲音，一邊欣賞河岸美景，看著離我們越來越近的晴空塔，走著走著便可抵達河川的另一岸。\n在東武鐵道高架下亦打造了最新的複合商業施設「東京Mizumachi（東京ミズマチ）」。「東京Mizumachi（東京ミズマチ）」分為東西兩個區域，有各式各樣的美食餐廳、咖啡廳、生活雜貨鋪，以及咖傳統日本甜點。", "kind": "遊記", "url": "https://www.funliday.com/prevengers/journals/57214"}], "observations": [{"trip_id": "funliday_57214", "months": [], "name_raw": "東京水岸街道 (Tokyo Mizumachi)", "visit_type": null, "stay_min": 60, "as_area": false}]}}, {"id": "P043", "label": "吉祥寺", "color": "#e15759", "has_ev": true, "count": 1, "title": "吉祥寺｜東京｜商圈老街｜1 個來源", "raw": {"poi_id": "P043", "poi_name": "吉祥寺", "category": "商圈老街", "area": "東京", "aliases": [], "lat": 35.7031337, "lon": 139.5797248, "duration": 210, "duration_samples": [210], "hours": [], "months": [], "source_count": 1, "url": ["https://www.funliday.com/prevengers/journals/57214"], "evidence": [{"text": "東京吉祥寺連續好幾年被日本民眾票選最想居住的區域的前幾名，在2022年的排名中，仍然是排在第二名，讓人對這個地區充滿好奇，想一探究竟。\n\n參觀完三鷹吉卜力美術館後，散步到腹地廣大的井之頭恩賜公園，在公園中還有自然文化園與神社，在櫻花季時更是有許多賞櫻的著名景點，除了在春天賞櫻，秋天時亦可賞楓，四季景觀十分豐富。這裡除了和一般公園一樣可以散散步和野餐以外，最有人氣的就是搭乘天鵝船了，在櫻花紛飛時在波光粼粼的湖上踩著天鵝船，想著就浪漫。\n\n離開井之頭恩賜公園後，回到鄰近車站的SUNROAD商店街逛逛，在吉祥寺必吃的就是「さとう（SATOU）」的特色黑毛和牛炸肉餅了吧，さとう（SATOU）標榜平民的價格就可以吃到黑毛和牛的美味，酥脆的外皮與多汁的肉餡，絕對值得排隊吃上一個。\n\n除了炸肉餅之外，位在さとう（SATOU）隔壁，從橫濱發跡的爆餡鯛魚燒「KURIKO庵」，也是必吃的平民美食，和POKEMON聯名合作，推出鯉魚王造型的鯛魚燒，可愛的造型讓人看到忍不住驚呼，不時會推出期間限定的口味，喜歡吃甜食的人絕對不能錯過。", "kind": "遊記", "url": "https://www.funliday.com/prevengers/journals/57214"}], "observations": [{"trip_id": "funliday_57214", "months": [], "name_raw": "吉祥寺站", "visit_type": null, "stay_min": 210, "as_area": true}]}}, {"id": "P044", "label": "西荻窪", "color": "#e15759", "has_ev": true, "count": 1, "title": "西荻窪｜東京｜商圈老街｜1 個來源", "raw": {"poi_id": "P044", "poi_name": "西荻窪", "category": "商圈老街", "area": "東京", "aliases": [], "lat": 35.7038061, "lon": 139.5994511, "duration": 120, "duration_samples": [120], "hours": [], "months": [], "source_count": 1, "url": ["https://www.funliday.com/prevengers/journals/57214"], "evidence": [{"text": "從吉祥寺離開後，搭乘JR中央本線，僅一站便到達了西荻窪站。西荻窪以眾多古董藝品店而聞名，雖然並非觀光客會特意到訪的地方，不似吉祥寺那般熱鬧繁華，但它亦擁有自己獨特的魅力。\n在車站附近散散步後，挑選了一家咖啡廳「Satén japanese tea」小歇一會，「Satén japanese tea」將日本傳統茶道結合現代飲品，讓年輕人們體會茶道中的純粹與甘甜滋味，亦減少了茶道與人們的距離感。在這裡，每一杯茶都由店員們親手細心泡製，除了可以直接感受日本茶道的講究，更是感受到了他們的用心。", "kind": "遊記", "url": "https://www.funliday.com/prevengers/journals/57214"}], "observations": [{"trip_id": "funliday_57214", "months": [], "name_raw": "西荻窪站", "visit_type": null, "stay_min": 120, "as_area": true}]}}, {"id": "P045", "label": "上野恩賜公園", "color": "#e15759", "has_ev": true, "count": 3, "title": "上野恩賜公園｜東京｜公園庭園｜3 個來源", "raw": {"poi_id": "P045", "poi_name": "上野恩賜公園", "category": "公園庭園", "area": "東京", "aliases": [], "lat": 35.7142003, "lon": 139.7723191, "duration": 150, "duration_samples": [150], "hours": [], "months": [3, 4, 10], "source_count": 3, "url": ["https://www.funliday.com/prevengers/journals/57214", "https://travel.liontravel.com/detail?NormGroupID=86545bd1-ff78-4498-9669-8111d8b78c0e", "https://www.travel4u.com.tw/group/itinerary/TYO05KHH012/"], "evidence": [{"text": "上野公園在1873年被政府認定為首座日本公園。在這片53萬平方公尺的場地上，還設立了上野動物園、不忍池、國立西洋美術館、下町風俗資料館等觀光景點。前一天已經造訪過井之頭恩賜公園，今天的主要目的地是位於上野公園裡的「上野東照宮」。\n「上野東照宮」是一座於1627年為了祭祀德川家康而建的神社，之後於1651年，由江戶幕府第三代將軍德川家光進行大規模改建。神殿使用了大量金箔，散發著豪華的氣息，因而也被稱為「金色殿」。神社對於事業發展、健康和長壽特別有幫助，因此有許多民眾會前往參拜。\n最喜歡的是東照宮裡面的「神符授与所」和「靜心所」，由中村拓志&NAP建築設計事務設計所設計的新建築，有別於金碧輝煌的金色殿，這邊採用現代化的建築設計，建造一個讓大家可以冥想的地方。在聖樹前找一個位置坐下來，遠離城市的喧囂，將內心平靜下來。", "kind": "遊記", "url": "https://www.funliday.com/prevengers/journals/57214"}], "observations": [{"trip_id": "funliday_57214", "months": [], "name_raw": "上野恩賜公園", "visit_type": null, "stay_min": 150, "as_area": false}, {"trip_id": "liontravel_86545bd1-ff78-4498-9669-8111d8b78c0e", "months": [10], "name_raw": "上野恩賜公園", "visit_type": null, "stay_min": null, "as_area": false}, {"trip_id": "travel4u_TYO05KHH012", "months": [3, 4], "name_raw": "上野恩賜公園", "visit_type": null, "stay_min": null, "as_area": false}]}}, {"id": "P046", "label": "築地本願寺", "color": "#e15759", "has_ev": true, "count": 1, "title": "築地本願寺｜東京｜神社寺廟｜1 個來源", "raw": {"poi_id": "P046", "poi_name": "築地本願寺", "category": "神社寺廟", "area": "東京", "aliases": [], "lat": 35.6664862, "lon": 139.7722836, "duration": 60, "duration_samples": [60], "hours": ["⏰06:00-16:00"], "months": [1], "source_count": 1, "url": ["https://www.funliday.com/fukuoka_yumeko/journals/72307"], "evidence": [{"text": "本院寺\n本院寺位子就在築地市場的旁邊，走路約五分鐘可以到達。蠻壯觀的一個建築物。如果有來築地市場也可以順路去走走\n\n本院寺\n📍東京都中央区築地３丁目１５−１\n⏰06:00-16:00\n🌍 tsukijihongwanji.jp", "kind": "遊記", "url": "https://www.funliday.com/fukuoka_yumeko/journals/72307"}], "observations": [{"trip_id": "funliday_72307", "months": [1], "name_raw": "築地市場本院寺", "visit_type": null, "stay_min": 60, "as_area": false}]}}, {"id": "P047", "label": "東京鐵塔", "color": "#e15759", "has_ev": true, "count": 5, "title": "東京鐵塔｜東京｜地標展望｜5 個來源", "raw": {"poi_id": "P047", "poi_name": "東京鐵塔", "category": "地標展望", "area": "東京", "aliases": ["東京タワー", "Tokyo Tower"], "lat": 35.6585791, "lon": 139.7454459, "duration": 150, "duration_samples": [150], "hours": ["⏰09:00-22:00"], "months": [1, 10], "source_count": 5, "url": ["https://www.funliday.com/fukuoka_yumeko/journals/72307", "https://travel.liontravel.com/detail?NormGroupID=4d01cab3-cb93-42d4-9b9a-2302d4db0776", "https://travel.liontravel.com/detail?NormGroupID=7ff4f886-7309-43fc-b358-24a91c90f94f", "https://travel.liontravel.com/detail?NormGroupID=86545bd1-ff78-4498-9669-8111d8b78c0e", "https://travel.liontravel.com/detail?NormGroupID=8c77783c-b6a4-468e-bc53-3798f19b23ad"], "evidence": [{"text": "再來我們搭乘電車到東京鐵塔🗼\n\n東京鐵塔🗼是東京的重要地標\n這集除了東京鐵塔外 \n還帶大家去看看跟東京鐵塔拍照的重要地標❗️\n\n東京タワー\n📍東京都港区芝公園４丁目２−８\n⏰09:00-22:00\n🌍 tokyotower.co.jp", "kind": "遊記", "url": "https://www.funliday.com/fukuoka_yumeko/journals/72307"}, {"text": "東京鐵塔旁 私房景點其實是個停車場的通道 \n如果要拍照 記得先讓行人使用唷～～\n\n東京鐵塔停車場🅿️\n📍東京都港区芝公園４丁目５", "kind": "遊記", "url": "https://www.funliday.com/fukuoka_yumeko/journals/72307"}], "observations": [{"trip_id": "funliday_72307", "months": [1], "name_raw": "東京タワー", "visit_type": null, "stay_min": 90, "as_area": false}, {"trip_id": "funliday_72307", "months": [1], "name_raw": "Tokyo Tower Station Parking lot", "visit_type": null, "stay_min": 60, "as_area": true}, {"trip_id": "liontravel_4d01cab3-cb93-42d4-9b9a-2302d4db0776", "months": [10], "name_raw": "東京鐵塔(不上塔)", "visit_type": null, "stay_min": null, "as_area": false}, {"trip_id": "liontravel_7ff4f886-7309-43fc-b358-24a91c90f94f", "months": [10], "name_raw": "東京鐵塔", "visit_type": null, "stay_min": null, "as_area": false}, {"trip_id": "liontravel_86545bd1-ff78-4498-9669-8111d8b78c0e", "months": [10], "name_raw": "東京鐵塔(不上塔)", "visit_type": null, "stay_min": null, "as_area": false}, {"trip_id": "liontravel_8c77783c-b6a4-468e-bc53-3798f19b23ad", "months": [10], "name_raw": "東京鐵塔", "visit_type": null, "stay_min": null, "as_area": false}]}}, {"id": "P048", "label": "增上寺", "color": "#e15759", "has_ev": true, "count": 1, "title": "增上寺｜東京｜神社寺廟｜1 個來源", "raw": {"poi_id": "P048", "poi_name": "增上寺", "category": "神社寺廟", "area": "東京", "aliases": ["増上寺"], "lat": 35.6574077, "lon": 139.748306, "duration": 120, "duration_samples": [120], "hours": ["⏰ 09:00-17:00"], "months": [1], "source_count": 1, "url": ["https://www.funliday.com/fukuoka_yumeko/journals/72307"], "evidence": [{"text": "東京鐵塔逛完 可以慢慢走到旁邊的增上寺\n大約走五分鐘 就可以拍到增上寺和東京鐵塔🗼在一起的照片了～\n\n增上寺\n📍 東京都港区芝公園４丁目７−３５\n⏰ 09:00-17:00\n🌍 zojoji.or.jp", "kind": "遊記", "url": "https://www.funliday.com/fukuoka_yumeko/journals/72307"}], "observations": [{"trip_id": "funliday_72307", "months": [1], "name_raw": "増上寺", "visit_type": null, "stay_min": 120, "as_area": false}]}}, {"id": "P049", "label": "中目黑星巴克旗艦店", "color": "#e15759", "has_ev": true, "count": 1, "title": "中目黑星巴克旗艦店｜東京｜餐飲（目的地型）｜1 個來源", "raw": {"poi_id": "P049", "poi_name": "中目黑星巴克旗艦店", "category": "餐飲（目的地型）", "area": "東京", "aliases": [], "lat": 35.6491566, "lon": 139.6926173, "duration": 120, "duration_samples": [120], "hours": ["⏰07:00-22:00"], "months": [1], "source_count": 1, "url": ["https://www.funliday.com/fukuoka_yumeko/journals/72307"], "evidence": [{"text": "晚上我們來到了 全日本最大的星巴克旗艦店 \n位子在中目黑，這家旗艦店非常的大 ，一共有三層樓。每層樓能買的東西都不同，在一樓還設有他們的旗艦限定商品，還有超大台的咖啡機器，蒸餾機器。在春天時這一家中目黑旗艦店總被擠滿人。能在這邊欣賞整排的櫻花🌸配上星巴克。今年春天如果有空 我也要再來一趟❤️❤️\n\n這家星巴克一樓還有販賣麵包，二樓茶飲，三樓咖啡….等等等。這次我點了裡面的茶飲和提拉米蘇。提拉米蘇不得不說 要好好的稱讚一下，真的超好吃的\n\n中目黑星巴克\n📍 東京都目黑區青葉台2-19-23\n⏰07:00-22:00\n🌍 store.starbucks.co.jp", "kind": "遊記", "url": "https://www.funliday.com/fukuoka_yumeko/journals/72307"}], "observations": [{"trip_id": "funliday_72307", "months": [1], "name_raw": "中目黑星巴克旗艦店", "visit_type": null, "stay_min": 120, "as_area": false}]}}, {"id": "P050", "label": "小田原城", "color": "#bab0ac", "has_ev": false, "count": 1, "title": "小田原城｜小田原｜歷史古蹟 ": "P091", "poi_name": "富士野生動物園", "name_raw": "富士野生動物園", "visit_type": null}, "mode": "自駕", "mode_inferred": true, "mode_basis": "旅行社跟團，原文未寫交通方式，預設遊覽車", "vehicle": null, "duration_min": null, "distance_km": null, "via": ["特別安排★鮮採季節水果"], "months": [1, 2, 3, 10, 11, 12], "trip_id": "travel4u_TYO06RMQ3", "day": 3, "seq": 1, "source_type": "旅行社", "evidence": ["河口湖四季絕景花街道【大石公園】春櫻、紫夏薰衣草、秋楓、逆富士雪景", "富士山下的野生動物樂園【富士野生動物園】特別安排★叢林巴士體驗近距離猛獸餵食"], "url": "https://www.travel4u.com.tw/group/itinerary/TYO06RMQ3/"}]}, {"id": "E0101", "from": "P092", "to": "P005", "mode": "自駕", "sources": ["旅行社"], "color": "#4a7fd6", "dashes": true, "width": 2, "title": "自駕｜1 次觀測（推測）｜有證據", "raw": [{"edge_id": "E0101", "from": {"poi_id": "P092", "poi_name": "河口湖富士山瞭望纜車", "name_raw": "河口湖 富士山瞭望纜車", "visit_type": null}, "to": {"poi_id": "P005", "poi_name": "御殿場 PREMIUM OUTLETS", "name_raw": "御殿場 PREMIUM OUTLETS", "visit_type": null}, "mode": "自駕", "mode_inferred": true, "mode_basis": "旅行社跟團，原文未寫交通方式，預設遊覽車", "vehicle": null, "duration_min": null, "distance_km": null, "via": [], "months": [1, 2, 3, 10, 11, 12], "trip_id": "travel4u_TYO06RMQ3", "day": 4, "seq": 1, "source_type": "旅行社", "evidence": ["制高點眺望富士山全景【河口湖 富士山瞭望纜車】天上山公園~無敵展望台富士山風景~貍貓茶屋~兔子神社", "絕美富士山【御殿場 PREMIUM OUTLETS】"], "url": "https://www.travel4u.com.tw/group/itinerary/TYO06RMQ3/"}]}], "stats": {"nodes": 93, "edges": 101, "merged_edges": 92, "trips": 17, "isolated": 5}, "legend": {"area": {"東京": "#e15759", "富士五湖": "#4e79a7", "鎌倉・江之島": "#f28e2b", "伊豆": "#76b7b2", "橫濱": "#59a14f", "箱根": "#edc948", "輕井澤": "#b07aa1", "千葉・房總": "#ff9da7", "熱海": "#9c755f"}, "other": "#bab0ac", "mode": {"自駕": "#4a7fd6", "走路": "#3aa36b", "大眾運輸": "#d9822b", "未知": "#999999"}}};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const link = u => u ? `<a href="${esc(u)}" target="_blank">${esc(u)}</a>` : "";
const byId = Object.fromEntries(D.nodes.map(n => [n.id, n]));
document.getElementById("stats").textContent =
  `${D.stats.nodes} 節點・${D.stats.edges} 條觀測邊（合併後 ${D.stats.merged_edges}）・${D.stats.trips} 個行程・孤立節點 ${D.stats.isolated}`;
document.getElementById("leg").innerHTML =
  Object.entries(D.legend.area).map(([a,c]) => `<span><i class="sw" style="background:${c}"></i>${esc(a)}</span>`).join("")
  + `<span><i class="sw" style="background:${D.legend.other}"></i>其他地區</span><br>`
  + Object.entries(D.legend.mode).map(([m,c]) => `<span><i class="ln" style="border-color:${c}"></i>${esc(m)}</span>`).join("");

// 圓圈＋圈內數字＋圈下名稱
const radius = n => 10 + 5 * Math.sqrt(n.count - 1);
function drawPoi({ctx, id, x, y, state: {selected, hover}}) {
  const n = byId[id], r = radius(n);
  return {
    drawNode() {
      ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
      ctx.fillStyle = n.color; ctx.fill();
      ctx.lineWidth = n.has_ev ? 3 : 1.5; ctx.strokeStyle = n.has_ev ? "#222" : "#fff"; ctx.stroke();
      if (selected || hover) { ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 2 * Math.PI); ctx.lineWidth = 2; ctx.strokeStyle = "#2a6fdb"; ctx.stroke(); }
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = `bold ${Math.round(r * .9 + 4)}px -apple-system,sans-serif`; ctx.fillStyle = "#fff";
      ctx.fillText(n.count, x, y + 1);
      ctx.font = '12px -apple-system,"PingFang TC",sans-serif'; ctx.fillStyle = "#333"; ctx.textBaseline = "top";
      ctx.fillText(n.label, x, y + r + 3);
    },
    nodeDimensions: {width: 2 * r, height: 2 * r},
  };
}

const nodes = new vis.DataSet(D.nodes.map(n => ({id: n.id, title: n.title, shape: "custom", ctxRenderer: drawPoi, size: radius(n)})));
const edges = new vis.DataSet(D.edges.map(e => ({id: e.id, from: e.from, to: e.to, title: e.title, width: e.width,
  dashes: e.dashes, color: {color: e.color, opacity: .8}})));
const edgeById = Object.fromEntries(D.edges.map(e => [e.id, e]));

const modes = [...new Set(D.edges.map(e => e.mode))], srcs = [...new Set(D.edges.flatMap(e => e.sources))];
const box = (id, vals, name) => document.getElementById(id).innerHTML =
  vals.map(v => `<label><input type="checkbox" data-${name}="${esc(v)}" checked> ${esc(v)}</label>`).join("");
box("modeF", modes, "mode"); box("srcF", srcs, "src");
const on = attr => new Set([...document.querySelectorAll(`[data-${attr}]`)].filter(x => x.checked).map(x => x.dataset[attr]));
const edgeOk = e => { const m = on("mode"), s = on("src"); return m.has(e.mode) && e.sources.some(x => s.has(x)); };
const nodeOk = n => !document.getElementById("hideIso").checked
  || D.edges.some(e => edgeOk(e) && (e.from === n.id || e.to === n.id));
const nv = new vis.DataView(nodes, {filter: nodeOk}), ev = new vis.DataView(edges, {filter: e => edgeOk(edgeById[e.id])});
document.querySelectorAll("aside input[type=checkbox]").forEach(x => x.onchange = () => { ev.refresh(); nv.refresh(); });

const net = new vis.Network(document.getElementById("net"), {nodes: nv, edges: ev}, {
  edges: {arrows: {to: {enabled: true, scaleFactor: .6}}, smooth: {type: "dynamic"}},
  physics: {solver: "forceAtlas2Based", forceAtlas2Based: {gravitationalConstant: -60, springLength: 100}, stabilization: {iterations: 300}},
  interaction: {hover: true},
});

const evHtml = list => (list || []).map(x => typeof x === "string"
  ? `<div class="ev">${esc(x)}</div>`
  : `<div class="ev"><b>${esc(x.kind)}</b> ${esc(x.text)}<br>${link(x.url)}</div>`).join("");
const detail = document.getElementById("detail");
function showNode(id) {
  const n = byId[id].raw;
  const deg = D.edges.filter(e => e.from === n.poi_id || e.to === n.poi_id).length;
  detail.innerHTML = `<b style="font-size:15px">${esc(n.poi_name)}</b> <span class="muted">${n.poi_id}</span><br>
    ${esc(n.area)}・${esc(n.category)}・${n.source_count} 個來源・${deg} 條相連邊<br>
    ${n.aliases.length ? "別名：" + esc(n.aliases.join("、")) + "<br>" : ""}
    月份：${n.months.join(", ") || "—"}・停留：${n.duration ?? "—"}・營業時間：${esc(JSON.stringify(n.hours))}<br>
    座標：${n.lat ?? "—"}, ${n.lon ?? "—"}
    <h3>證據（${n.evidence.length}）</h3>${evHtml(n.evidence) || '<span class="muted">無</span>'}
    <h3>觀測（${n.observations.length}）</h3>` +
    n.observations.map(o => `<div class="obs">${esc(o.trip_id)}・${esc(o.name_raw)}・${esc(o.visit_type ?? "")}・月份 ${o.months.join(",")}</div>`).join("") +
    `<h3>來源</h3>` + n.url.map(u => `<div>${link(u)}</div>`).join("");
}
function showEdge(id) {
  const e = edgeById[id];
  detail.innerHTML = `<b style="font-size:15px">${esc(e.raw[0].from.poi_name)} → ${esc(e.raw[0].to.poi_name)}</b><br>${esc(e.mode)}・${e.raw.length} 次觀測` +
    e.raw.map(o => `<div class="obs"><b>${o.edge_id}</b> ${esc(o.trip_id)}・第 ${o.day} 天第 ${o.seq} 段・${esc(o.source_type)}<br>
      ${esc(o.from.name_raw)} → ${esc(o.to.name_raw)}<br>
      交通：${esc(o.mode ?? "未知")}${o.vehicle ? "（" + esc(o.vehicle) + "）" : ""}${o.mode_inferred ? ' <span class="muted">推測：' + esc(o.mode_basis) + "</span>" : ""}<br>
      時間：${o.duration_min ?? "—"} 分・距離：${o.distance_km ?? "—"} km${o.via.length ? "<br>途經：" + esc(o.via.join("、")) : ""}
      ${evHtml(o.evidence)}${link(o.url)}</div>`).join("");
}
net.on("click", p => { if (p.nodes.length) showNode(p.nodes[0]); else if (p.edges.length) showEdge(p.edges[0]); });
document.getElementById("q").onkeydown = e => {
  if (e.key !== "Enter") return;
  const q = e.target.value;
  const hit = D.nodes.find(n => n.label.includes(q) || (n.raw.aliases || []).some(a => a.includes(q)));
  if (hit) { net.selectNodes([hit.id]); net.focus(hit.id, {scale: 1.4, animation: true}); showNode(hit.id); }
};
